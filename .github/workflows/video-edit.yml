name: Video Edit

run-name: "edit ${{ inputs.shortcode || github.run_id }}"

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "URL of video to edit (leave empty to use bundled video.mp4)"
        required: false
      template:
        description: "Template name to use for editing (e.g. default)"
        required: false
        default: "default"
      static_text:
        description: "Static text for first phase (0-2s)"
        required: false
      marquee_text:
        description: "Marquee text (2s-end)"
        required: false
      watermark_text:
        description: "Watermark text"
        required: false
      webhook_url:
        description: "Webhook URL to notify when build completes (optional)"
        required: false
      shortcode:
        description: "Video shortcode for webhook callback (optional)"
        required: false
      composition:
        description: "Composition to render"
        required: false
        default: "InstagramReel"
        type: choice
        options:
          - InstagramReel
          - YouTubeLongVideo
          - DynamicTemplate
      subtitle_content:
        description: "WebVTT subtitle content"
        required: false
      template_config:
        description: "Template config JSON (for DynamicTemplate composition)"
        required: false
      output_format:
        description: "Output format: mp4 (direct download) or zip (artifact)"
        required: false
        default: "mp4"
        type: choice
        options:
          - mp4
          - zip

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Cache Remotion dependencies
      id: remotion-cache
      uses: actions/cache@v4
      with:
        path: |
          remotion-video-creator/node_modules
          remotion-video-creator/.remotion
        key: remotion-${{ runner.os }}-${{ hashFiles('remotion-video-creator/package-lock.json') }}
        restore-keys: |
          remotion-${{ runner.os }}-

    - name: Install Remotion dependencies
      if: steps.remotion-cache.outputs.cache-hit != 'true'
      working-directory: remotion-video-creator
      run: npm ci

    - name: Download video from URL
      if: github.event.inputs.video_url != ''
      env:
        VIDEO_URL: ${{ github.event.inputs.video_url }}
      run: |
        set -euo pipefail
        echo "Downloading video from URL..."
        echo "URL length: ${#VIDEO_URL} characters"

        case "$VIDEO_URL" in
          https://*) ;;
          *)
            echo "ERROR: Only https URLs are allowed"
            exit 1
            ;;
        esac

        # Save URL to file to avoid shell escaping issues
        printf '%s' "$VIDEO_URL" > /tmp/video_url.txt

        curl -fsSL --retry 3 --retry-delay 2 --max-time 120 --max-filesize 209715200 \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
          -o remotion-video-creator/public/input_video.mp4 \
          "$(cat /tmp/video_url.txt)"

        echo "Downloaded video size: $(du -h remotion-video-creator/public/input_video.mp4 | cut -f1)"
        echo "File type: $(file remotion-video-creator/public/input_video.mp4)"

    - name: Validate video file
      if: github.event.inputs.video_url != ''
      working-directory: remotion-video-creator
      run: |
        set -euo pipefail
        echo "Validating downloaded video file..."
        FILE_SIZE=$(wc -c < public/input_video.mp4)
        echo "File size: $FILE_SIZE bytes"
        if [ "$FILE_SIZE" -lt 1000 ]; then
          echo "ERROR: Downloaded file is too small, likely not a valid video"
          exit 1
        fi
        STREAM_TYPE=$(npx remotion ffprobe -v error -select_streams v:0 \
          -show_entries stream=codec_type -of default=noprint_wrappers=1:nokey=1 \
          public/input_video.mp4)
        echo "Primary stream type: ${STREAM_TYPE:-none}"
        if [ "$STREAM_TYPE" != "video" ]; then
          echo "ERROR: No video stream detected in downloaded file"
          exit 1
        fi

    - name: Prepare video file
      run: |
        set -euo pipefail
        mkdir -p outputs
        cd remotion-video-creator/public
        if [ -f "input_video.mp4" ]; then
          echo "Using downloaded video"
          cp input_video.mp4 video.mp4
          echo "Copied video.mp4 size: $(du -h video.mp4 | cut -f1)"
        else
          echo "Using bundled video.mp4"
        fi
        ls -la *.mp4

    - name: Render video with Remotion
      env:
        STATIC_TEXT: ${{ github.event.inputs.static_text }}
        MARQUEE_TEXT: ${{ github.event.inputs.marquee_text }}
        WATERMARK_TEXT: ${{ github.event.inputs.watermark_text }}
        SUBTITLE_CONTENT: ${{ github.event.inputs.subtitle_content }}
        TEMPLATE_CONFIG: ${{ github.event.inputs.template_config }}
        COMPOSITION: ${{ github.event.inputs.composition || 'InstagramReel' }}
      working-directory: remotion-video-creator
      run: |
        set -euo pipefail
        # Detect video duration using Remotion's bundled ffprobe
        DURATION=$(npx remotion ffprobe -v error -show_entries format=duration \
          -of default=noprint_wrappers=1:nokey=1 public/video.mp4 2>/dev/null || echo "15")
        if [ -z "$DURATION" ] || [ "$DURATION" = "N/A" ]; then
          DURATION=15
        fi
        echo "Detected video duration: ${DURATION}s"
        echo "Composition: ${COMPOSITION}"

        # Build props JSON to a file (avoids shell escaping issues)
        if [ "$COMPOSITION" = "DynamicTemplate" ]; then
          python3 -c "
        import json, os

        props = {
            'templateConfig': os.environ.get('TEMPLATE_CONFIG', '{}'),
            'videoSrc': 'video.mp4',
            'subtitleContent': os.environ.get('SUBTITLE_CONTENT', ''),
            'title': os.environ.get('STATIC_TEXT', ''),
            'watermark': os.environ.get('WATERMARK_TEXT', ''),
            'scrollingText': os.environ.get('MARQUEE_TEXT', ''),
            'durationInSeconds': float('${DURATION}'),
        }

        with open('/tmp/props.json', 'w', encoding='utf-8') as f:
            json.dump(props, f, ensure_ascii=False)
        "
        elif [ "$COMPOSITION" = "YouTubeLongVideo" ]; then
          python3 -c "
        import json, os

        props = {
            'videoSrc': 'video.mp4',
            'subtitleContent': os.environ.get('SUBTITLE_CONTENT', ''),
            'durationInSeconds': float('${DURATION}'),
        }

        with open('/tmp/props.json', 'w', encoding='utf-8') as f:
            json.dump(props, f, ensure_ascii=False)
        "
        else
          python3 -c "
        import json, os

        props = {
            'watermark': os.environ.get('WATERMARK_TEXT', ''),
            'title': os.environ.get('STATIC_TEXT', ''),
            'scrollingText': os.environ.get('MARQUEE_TEXT', ''),
            'videoSrc': 'video.mp4',
            'durationInSeconds': float('${DURATION}'),
        }

        with open('/tmp/props.json', 'w', encoding='utf-8') as f:
            json.dump(props, f, ensure_ascii=False)
        "
        fi

        echo "Props file content:"
        cat /tmp/props.json | python3 -c "import json,sys; d=json.load(sys.stdin); d['subtitleContent']=d.get('subtitleContent','')[:100]+'...' if len(d.get('subtitleContent',''))>100 else d.get('subtitleContent',''); print(json.dumps(d, indent=2, ensure_ascii=False))"

        npx remotion render \
          --props="/tmp/props.json" \
          --output="../outputs/output.mp4" \
          --codec="h264" \
          --pixel-format="yuv420p" \
          --crf="18" \
          --concurrency=4 \
          "${COMPOSITION}"

    # Optional debug path only — successful delivery uses private R2 keys, not GitHub Releases.
    - name: Upload as Artifact (zip)
      if: github.event.inputs.output_format == 'zip'
      uses: actions/upload-artifact@v4
      with:
        name: edited-video
        path: outputs/output.mp4
        retention-days: 7

    - name: Upload output to R2
      if: success() && github.event.inputs.output_format != 'zip'
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
        R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        SHORTCODE: ${{ github.event.inputs.shortcode }}
        RUN_ID: ${{ github.run_id }}
        # aws CLI reads these standard names
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
        AWS_EC2_METADATA_DISABLED: "true"
      run: |
        set -euo pipefail
        missing=0
        for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE_URL; do
          if [ -z "${!v}" ]; then
            echo "ERROR: GitHub secret $v is not set. Configure R2 credentials before rendering."
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          exit 1
        fi

        if [ ! -f outputs/output.mp4 ]; then
          echo "ERROR: outputs/output.mp4 not found"
          exit 1
        fi

        JOB_KEY=$(printf '%s' "${SHORTCODE:-run-${RUN_ID}}" | tr -cd 'A-Za-z0-9_-' | cut -c1-64)
        if [ -z "$JOB_KEY" ]; then
          JOB_KEY="run-${RUN_ID}"
        fi
        RAND=$(openssl rand -hex 16)
        OBJECT_KEY="renders/${JOB_KEY}/${RAND}.mp4"
        ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

        echo "Uploading to s3://${R2_BUCKET}/${OBJECT_KEY}"
        aws s3 cp outputs/output.mp4 "s3://${R2_BUCKET}/${OBJECT_KEY}" \
          --endpoint-url "$ENDPOINT" \
          --content-type "video/mp4" \
          --no-progress

        BASE="${R2_PUBLIC_BASE_URL%/}"
        OUTPUT_URL="${BASE}/${OBJECT_KEY}"
        echo "OUTPUT_URL=${OUTPUT_URL}" >> "$GITHUB_ENV"
        echo "Uploaded object key: ${OBJECT_KEY}"

    - name: Notify webhook
      if: always() && github.event.inputs.webhook_url != ''
      env:
        WEBHOOK_URL: ${{ github.event.inputs.webhook_url }}
        SHORTCODE: ${{ github.event.inputs.shortcode }}
        TAG: video-${{ github.run_number }}
        RUN_NUMBER: ${{ github.run_number }}
        OUTPUT_URL: ${{ env.OUTPUT_URL }}
        OUTPUT_FORMAT: ${{ github.event.inputs.output_format }}
        CALLBACK_SECRET: ${{ secrets.WORKFLOW_CALLBACK_SECRET }}
        JOB_STATUS: ${{ job.status }}
      run: |
        set -euo pipefail
        echo "Notifying webhook: $WEBHOOK_URL (job status: $JOB_STATUS)"
        if [ -z "$CALLBACK_SECRET" ]; then
          echo "ERROR: WORKFLOW_CALLBACK_SECRET is not set; the callback would be rejected."
          exit 1
        fi

        if [ "$JOB_STATUS" = "success" ] && [ "${OUTPUT_FORMAT:-mp4}" != "zip" ]; then
          if [ -z "${OUTPUT_URL:-}" ]; then
            echo "ERROR: OUTPUT_URL is empty after R2 upload; refusing to notify with a missing media URL."
            exit 1
          fi
        fi

        python3 -c "
        import json, os
        job_status = os.environ.get('JOB_STATUS', 'failure')
        status = 'success' if job_status == 'success' else 'failure'
        payload = {
            'shortcode': os.environ.get('SHORTCODE', ''),
            'status': status,
            'tag': os.environ.get('TAG', ''),
            'run_number': os.environ.get('RUN_NUMBER', ''),
        }
        if status == 'success':
            output_url = os.environ.get('OUTPUT_URL', '').strip()
            if output_url:
                payload['output_url'] = output_url
            else:
                payload['status'] = 'failure'
                payload['error'] = 'Workflow succeeded but output_url was not produced (R2 upload required)'
        else:
            payload['error'] = f'Workflow {job_status}'
        with open('/tmp/callback.json', 'w', encoding='utf-8') as f:
            json.dump(payload, f, ensure_ascii=False)
        "

        SIGNATURE=$(openssl dgst -sha256 -hmac "$CALLBACK_SECRET" -hex < /tmp/callback.json | awk '{print $NF}')

        curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
          -X POST "$WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -H "X-Signature-256: sha256=$SIGNATURE" \
          --data-binary @/tmp/callback.json
