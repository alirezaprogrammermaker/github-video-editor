# Analyze Video — extracts frames + size-capped WAV and POSTs to a Worker webhook.
#
# Webhook JSON payload (Worker must align):
#   {
#     "shortcode": string,
#     "frames": string[],                 # base64 JPEG, max MAX_FRAMES
#     "frame_mime": "image/jpeg",
#     "audio": string,                    # base64 WAV pcm_s16le (empty if no audio)
#     "audio_mime": "audio/wav",
#     "audio_duration": number            # seconds (of the extracted clip)
#   }
# Limits (workflow env):
#   MAX_VIDEO_BYTES=209715200 (200 MiB)   — download hard cap
#   MAX_FRAMES=5                          — JPEG frames, scaled to FRAME_WIDTH=640, -q:v 6
#   MAX_AUDIO_SECONDS=60                  — WAV mono 16 kHz pcm_s16le (~1.9 MB raw / ~2.6 MB b64)
#   MAX_PAYLOAD_BYTES=8388608 (8 MiB)     — frames trimmed from the end if over; then fail
#
# Audio format: WAV (not Opus). `@cf/openai/whisper` is documented/demoed with WAV/MP3
# file bytes as a 0–255 integer array; Opus would require in-Worker decode we do not have.
# Callback is HMAC-signed with WORKFLOW_CALLBACK_SECRET (same as video-edit.yml).
name: Analyze Video
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL"
        required: true
      webhook_url:
        description: "Webhook URL"
        required: false
      shortcode:
        description: "Shortcode"
        required: false

permissions:
  contents: read

env:
  MAX_VIDEO_BYTES: "209715200"
  MAX_FRAMES: "5"
  FRAME_WIDTH: "640"
  MAX_AUDIO_SECONDS: "60"
  MAX_PAYLOAD_BYTES: "8388608"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Install FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
        run: |
          set -euo pipefail

          case "$VIDEO_URL" in
            https://*) ;;
            *) echo "::error::video_url must be an https URL"; exit 1 ;;
          esac

          curl --fail --silent --show-error --location \
               --proto '=https' --proto-redir '=https' \
               --max-time 300 --max-filesize "$MAX_VIDEO_BYTES" \
               -o video.mp4 "$VIDEO_URL"

          SIZE=$(stat -c%s video.mp4 2>/dev/null || echo 0)
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::Could not download a usable video (size: $SIZE bytes)"
            exit 1
          fi
          if [ "$SIZE" -gt "$MAX_VIDEO_BYTES" ]; then
            echo "::error::Video exceeds the $MAX_VIDEO_BYTES byte limit (size: $SIZE bytes)"
            exit 1
          fi
          echo "Size: $(du -h video.mp4 | cut -f1)"

      - name: Extract frames
        run: |
          set -euo pipefail
          DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 video.mp4 || true)
          # Reject non-numeric / N/A / tiny durations; fall back to 25s so fps=1/INT stays valid.
          INT=$(awk -v d="${DUR:-0}" -v n="$MAX_FRAMES" 'BEGIN {
            if (d + 0 <= 0.1) d = 25
            i = (d + 0) / n
            if (i < 0.5) i = 0.5
            printf "%.3f", i
          }')
          echo "Duration: ${DUR:-unknown}, frame interval: ${INT}s"
          ffmpeg -nostdin -loglevel error -i video.mp4 \
            -vf "fps=1/$INT,scale=$FRAME_WIDTH:-2" \
            -frames:v "$MAX_FRAMES" -q:v 6 frame_%d.jpg -y

      - name: Extract audio
        run: |
          set -euo pipefail
          HAS_AUDIO=$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 video.mp4 | head -n 1)
          if [ -z "$HAS_AUDIO" ]; then
            echo "No audio stream found, skipping."
            exit 0
          fi
          # WAV pcm_s16le @ 16 kHz mono — format used in Cloudflare Whisper docs examples.
          # Capped to MAX_AUDIO_SECONDS so base64 stays under the JSON payload budget.
          ffmpeg -nostdin -loglevel error -i video.mp4 -vn \
            -t "$MAX_AUDIO_SECONDS" -ac 1 -ar 16000 \
            -c:a pcm_s16le audio.wav -y

      - name: Send webhook
        if: github.event.inputs.webhook_url
        env:
          WEBHOOK_URL: ${{ github.event.inputs.webhook_url }}
          SHORTCODE: ${{ github.event.inputs.shortcode }}
          CALLBACK_SECRET: ${{ secrets.WORKFLOW_CALLBACK_SECRET }}
        run: |
          set -euo pipefail

          case "$WEBHOOK_URL" in
            https://*) ;;
            *) echo "::error::webhook_url must be an https URL"; exit 1 ;;
          esac

          if [ -z "$CALLBACK_SECRET" ]; then
            echo "::error::WORKFLOW_CALLBACK_SECRET is not set; the callback would be rejected."
            exit 1
          fi

          python3 - <<'PY'
          import base64, glob, json, os, subprocess

          max_frames = int(os.environ["MAX_FRAMES"])
          max_payload = int(os.environ["MAX_PAYLOAD_BYTES"])

          def audio_duration(path):
              try:
                  out = subprocess.run(
                      ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                       "-of", "default=noprint_wrappers=1:nokey=1", path],
                      capture_output=True, text=True, check=True,
                  ).stdout.strip()
                  return round(float(out), 3)
              except Exception:
                  return 0.0

          frames = []
          for path in sorted(glob.glob("frame_*.jpg"))[:max_frames]:
              with open(path, "rb") as fh:
                  frames.append(base64.b64encode(fh.read()).decode())

          audio_b64 = ""
          duration = 0.0
          if os.path.exists("audio.wav"):
              with open("audio.wav", "rb") as fh:
                  audio_b64 = base64.b64encode(fh.read()).decode()
              duration = audio_duration("audio.wav")

          payload = {
              "shortcode": os.environ.get("SHORTCODE", ""),
              "frames": frames,
              "frame_mime": "image/jpeg",
              "audio": audio_b64,
              "audio_mime": "audio/wav",
              "audio_duration": duration,
          }

          def encoded_size(p):
              return len(json.dumps(p).encode())

          while encoded_size(payload) > max_payload and payload["frames"]:
              payload["frames"] = payload["frames"][:-1]

          size = encoded_size(payload)
          if size > max_payload:
              raise SystemExit(f"payload is {size} bytes, above the {max_payload} byte limit")

          with open("payload.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh)

          print(f"frames={len(payload['frames'])} audio_duration={duration}s payload={size} bytes")
          PY

          SIGNATURE=$(openssl dgst -sha256 -hmac "$CALLBACK_SECRET" -hex < payload.json | awk '{print $NF}')

          curl --fail --silent --show-error --location \
               --proto '=https' --proto-redir '=https' \
               --max-time 120 \
               -X POST "$WEBHOOK_URL" \
               -H "Content-Type: application/json" \
               -H "X-Signature-256: sha256=$SIGNATURE" \
               --data-binary @payload.json
