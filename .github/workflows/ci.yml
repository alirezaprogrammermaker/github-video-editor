name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  remotion:
    name: remotion-video-creator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: remotion-video-creator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion-video-creator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test
